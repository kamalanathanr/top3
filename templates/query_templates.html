<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Templates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }
        .btn-primary {
            @apply px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition;
        }
        .btn-secondary {
            @apply px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-900 font-medium rounded-lg transition;
        }
        .nav-link {
            @apply text-gray-700 hover:text-blue-600 font-medium transition;
        }
        .card {
            @apply bg-white rounded-lg shadow-sm border border-gray-200;
        }
        .form-input {
            @apply w-full px-4 py-3 bg-gray-50 text-gray-900 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent;
        }
        textarea.form-input {
            @apply font-mono text-sm;
        }
        .template-item {
            @apply p-4 border border-gray-200 rounded-lg cursor-pointer transition hover:bg-blue-50 hover:border-blue-400;
        }
        .template-item.active {
            @apply bg-blue-50 border-blue-500 border-2;
        }
        .template-item.add-new {
            @apply border-dashed border-2 border-blue-300 hover:border-blue-500 hover:bg-blue-100;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-gray-50 to-white min-h-screen">
    <!-- Navigation Bar -->
    <div id="site-nav"></div>
    <script src="/static/nav.js?v=2"></script>

    <div class="pt-20 pb-10">
        <div class="max-w-7xl mx-auto px-6">
            <!-- Header Section -->
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-blue-700 mb-2">Query Templates</h2>
                <p class="text-lg text-gray-600">Create and manage AI analysis templates</p>
            </div>

            <!-- Two Column Layout: Left (Templates List) + Right (Editor) -->
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <!-- Left Sidebar: Templates List -->
                <div class="lg:col-span-1">
                    <div class="card p-4 sticky top-24">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">Templates</h3>

                        <!-- Templates List -->
                        <div id="templates-list" class="space-y-2 mb-4">
                            <!-- Loaded by JavaScript -->
                        </div>

                        <!-- Add New Template Button -->
                        <button
                            onclick="createNewTemplate()"
                            class="template-item add-new w-full text-center font-medium text-blue-600 hover:text-blue-700">
                            + Add New Template
                        </button>
                    </div>
                </div>

                <!-- Right Panel: Template Editor -->
                <div class="lg:col-span-3">
                    <div class="card p-8" id="editor-panel" style="display: none;">
                        <!-- Template Details -->
                        <div id="template-editor">
                            <div class="flex justify-between items-start mb-6 pb-4 border-b border-gray-200">
                                <div>
                                    <h3 id="editor-title" class="text-2xl font-bold text-gray-900">Template Editor</h3>
                                    <p id="editor-subtitle" class="text-gray-600 text-sm mt-1"></p>
                                </div>
                                <div class="flex gap-2">
                                    <button id="save-btn" onclick="saveTemplate()" class="btn-primary" style="display: none;">Save Changes</button>
                                    <button id="delete-btn" onclick="deleteTemplate()" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-800 rounded-lg font-medium" style="display: none;">Delete</button>
                                </div>
                            </div>

                            <!-- Two Column Layout: Left + Right -->
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <!-- LEFT COLUMN (1/3) -->
                                <div class="lg:col-span-1 space-y-6">
                                    <!-- Template Name -->
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-900 mb-2">Template Name *</label>
                                        <input id="editor-name" type="text" class="form-input" placeholder="e.g., Travel Guide">
                                    </div>

                                    <!-- Category -->
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-900 mb-2">Category *</label>
                                        <input type="text" id="editor-category" list="categoryList" class="form-input" placeholder="Select or type a category…">
                                        <datalist id="categoryList"></datalist>
                                    </div>

                                    <!-- Description -->
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-900 mb-2">Description</label>
                                        <input id="editor-description" type="text" class="form-input" placeholder="When to use this template">
                                    </div>

                                    <!-- Keywords -->
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-900 mb-2">Keywords (comma-separated)</label>
                                        <input id="editor-keywords" type="text" class="form-input" placeholder="e.g., travel, vacation, trip">
                                    </div>

                                    <!-- Results to Fetch -->
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-900 mb-2">Results to Fetch *</label>
                                        <input id="editor-results" type="number" class="form-input" min="1" max="20" placeholder="e.g., 5">
                                    </div>
                                </div>

                                <!-- RIGHT COLUMN (2/3) -->
                                <div class="lg:col-span-2 flex flex-col gap-4">
                                    <!-- Set as Default Checkbox -->
                                    <div>
                                        <label class="flex items-center gap-3 cursor-pointer p-4 bg-blue-50 rounded-lg border border-blue-200">
                                            <input type="checkbox" id="editor-default" onchange="setAsDefault()" class="w-5 h-5">
                                            <span class="text-sm font-semibold text-gray-900">Set as Default Template</span>
                                        </label>
                                    </div>

                                    <!-- Query Template - Half Size with Scroll -->
                                    <div class="flex-1 flex flex-col">
                                        <label class="block text-sm font-semibold text-gray-900 mb-2">Query Template *</label>
                                        <textarea
                                            id="editor-template"
                                            class="form-input resize-none overflow-y-auto"
                                            style="height: 300px;"
                                            placeholder="Enter the AI prompt. Use {interests} and {profile} as placeholders."></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Status Notification -->
                            <div id="editor-status" class="mt-6 p-4 rounded-lg text-sm font-medium hidden" style="display: none;">
                            </div>
                        </div>
                    </div>

                    <!-- No Selection State -->
                    <div class="card p-12 text-center" id="empty-state">
                        <p class="text-gray-500 text-lg">Select a template from the list to edit, or create a new one</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let templates = [];
        let strategies = [];
        let currentTemplateId = null;

        async function loadTemplates() {
            try {
                const response = await fetch('/api/query-templates');
                const data = await response.json();
                templates = data.templates || [];
                renderTemplatesList();
                populateTemplateSelect();
                populateCategoryList();
            } catch (error) {
                console.error('Error loading templates:', error);
            }
        }

        function populateCategoryList() {
            const dl = document.getElementById('categoryList');
            const unique = [...new Set(templates.map(t => t.category).filter(Boolean))].sort();
            dl.innerHTML = unique.map(c => `<option value="${c}">`).join('');
        }

        function renderTemplatesList() {
            const list = document.getElementById('templates-list');
            list.innerHTML = templates.map(template => {
                // Show first 60 chars of template query
                const templatePreview = template.template ? template.template.substring(0, 60).replace(/\n/g, ' ') + (template.template.length > 60 ? '...' : '') : 'No template';
                return `
                <div
                    class="template-item ${currentTemplateId === template._id ? 'active' : ''}"
                    onclick="selectTemplate('${template._id}')"
                    title="Template: ${template.template || ''}">
                    <div class="font-medium text-gray-900 text-sm">${template.name}</div>
                    <div class="text-xs text-gray-500 mt-1">${template.category}</div>
                    <div class="text-xs text-gray-600 mt-2 font-mono bg-gray-100 p-2 rounded truncate">Template: ${templatePreview}</div>
                </div>
            `}).join('');
        }

        function selectTemplate(templateId) {
            currentTemplateId = templateId;
            const template = templates.find(t => t._id === templateId);
            if (!template) return;

            // Show editor, hide empty state
            document.getElementById('editor-panel').style.display = 'block';
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('save-btn').style.display = 'inline-block';
            document.getElementById('delete-btn').style.display = 'inline-block';

            // Populate fields
            document.getElementById('editor-title').textContent = template.name;
            document.getElementById('editor-subtitle').textContent = `${template.category} • Created ${new Date(template.created_at).toLocaleDateString()}`;
            document.getElementById('editor-name').value = template.name;
            document.getElementById('editor-category').value = template.category;
            document.getElementById('editor-description').value = template.description || '';
            document.getElementById('editor-keywords').value = (template.keywords || []).join(', ');
            document.getElementById('editor-results').value = template.results || 5;
            document.getElementById('editor-template').value = template.template;
            document.getElementById('editor-default').checked = template.is_default || false;

            // Clear status
            document.getElementById('editor-status').textContent = '';

            renderTemplatesList();
        }

        function createNewTemplate() {
            // Show editor with empty fields
            currentTemplateId = null;
            document.getElementById('editor-panel').style.display = 'block';
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('save-btn').style.display = 'inline-block';
            document.getElementById('delete-btn').style.display = 'none';

            document.getElementById('editor-title').textContent = 'New Template';
            document.getElementById('editor-subtitle').textContent = '';
            document.getElementById('editor-name').value = '';
            document.getElementById('editor-category').value = '';
            document.getElementById('editor-description').value = '';
            document.getElementById('editor-keywords').value = '';
            document.getElementById('editor-results').value = '5';
            document.getElementById('editor-template').value = '';
            document.getElementById('editor-default').checked = false;
            document.getElementById('editor-status').textContent = '';

            renderTemplatesList();
        }

        async function setAsDefault() {
            const isDefault = document.getElementById('editor-default').checked;
            if (!isDefault) return;

            // Uncheck all other default checkboxes
            templates.forEach(t => {
                if (t._id !== currentTemplateId) {
                    t.is_default = false;
                }
            });

            renderTemplatesList();
        }

        function showNotification(message, type = 'success') {
            const statusEl = document.getElementById('editor-status');
            statusEl.style.display = 'block';

            if (type === 'success') {
                statusEl.className = 'mt-6 p-4 rounded-lg text-sm font-medium bg-green-100 text-green-800 border border-green-300';
                statusEl.textContent = '✓ ' + message;
            } else {
                statusEl.className = 'mt-6 p-4 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-300';
                statusEl.textContent = '✗ ' + message;
            }

            // Auto-hide after 5 seconds
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 5000);
        }

        async function saveTemplate() {
            const name = document.getElementById('editor-name').value.trim();
            const category = document.getElementById('editor-category').value.trim();
            const template = document.getElementById('editor-template').value.trim();
            const keywords = document.getElementById('editor-keywords').value.trim();
            const results = document.getElementById('editor-results').value;
            const description = document.getElementById('editor-description').value.trim();
            const isDefault = document.getElementById('editor-default').checked;

            if (!name || !category || !template) {
                showNotification('Please fill in all required fields', 'error');
                return;
            }

            try {
                const url = currentTemplateId
                    ? `/api/query-templates/${currentTemplateId}`
                    : '/api/query-templates';
                const method = currentTemplateId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        category,
                        template,
                        keywords: keywords ? keywords.split(',').map(k => k.trim()) : [],
                        results: parseInt(results) || 5,
                        description,
                        is_default: isDefault
                    })
                });

                if (response.ok) {
                    showNotification('Template saved successfully!', 'success');
                    setTimeout(() => {
                        loadTemplates();
                        if (currentTemplateId) selectTemplate(currentTemplateId);
                    }, 1000);
                } else {
                    const error = await response.json();
                    showNotification(error.error || 'Error saving template', 'error');
                }
            } catch (error) {
                console.error('Error saving template:', error);
                showNotification('Error saving template', 'error');
            }
        }

        async function deleteTemplate() {
            if (!confirm('Delete this template?')) return;
            if (!currentTemplateId) return;

            try {
                const response = await fetch(`/api/query-templates/${currentTemplateId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showNotification('Template deleted successfully!', 'success');
                    currentTemplateId = null;
                    document.getElementById('editor-panel').style.display = 'none';
                    document.getElementById('empty-state').style.display = 'block';
                    setTimeout(() => {
                        loadTemplates();
                    }, 1000);
                } else {
                    showNotification('Error deleting template', 'error');
                }
            } catch (error) {
                console.error('Error deleting template:', error);
                showNotification('Error deleting template', 'error');
            }
        }

        // Initialize
        (async () => {
            await loadTemplates();
        })();
    </script>
</body>
</html>
